<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transactions — foldable iPhone, inner screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3F0}
a{color:#C2461A}a:hover{color:#9E3712}
</style>
</helmet>
<div style="position: relative; width: 760px; height: 1100px; overflow: hidden; background: #F4F3F0; color: #18181B; font-family: 'Geist', 'Noto Sans JP', sans-serif; font-variant-numeric: tabular-nums">
<div style="padding: 40px 24px 100px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Transactions</h1>
<div style="display: flex; gap: 8px">
<a href="Scan.dc.html" aria-label="Scan a receipt" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #E4E2DD; background: #FFFFFF; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M8 9h8M8 12h8M8 15h5"></path></svg></a>
<button aria-label="Search" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E4E2DD; background: #FFFFFF; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button aria-label="Import a statement" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E4E2DD; background: #FFFFFF; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5"></path></svg></button>
</div>
</div><div style="width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px"><div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E9E7E2; border-radius: 10px; padding: 3px">
<a href="Transactions.dc.html" role="tab" aria-selected="true" style="height: 34px; border-radius: 8px; background: #FFFFFF; color: #18181B; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">List</a>
<a href="Spending.dc.html" role="tab" aria-selected="false" style="height: 34px; border-radius: 8px; color: #5F5E66; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center">Spending</a>
</div><div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 4px">
<button aria-label="Previous month" style="width: 32px; height: 32px; border: none; background: transparent; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<span style="font-size: 15px; font-weight: 600; white-space: nowrap">September 2026</span>
<button aria-label="Next month" style="width: 32px; height: 32px; border: none; background: transparent; color: #B8B5AE; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</div><span style="font-size: 12px; color: #5F5E66; margin-top: -8px">142 transactions · in ¥452,000 · out ¥366,420</span><div style="display: flex; gap: 8px; overflow: hidden">
<button style="font: inherit; font-size: 13px; font-weight: 600; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #18181B; background: #18181B; color: #FFFFFF; white-space: nowrap">All</button>
<button style="font: inherit; font-size: 13px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D7D4CC; background: #FFFFFF; color: #18181B; white-space: nowrap">To review <b style="color: #C2461A">3</b></button>
<button style="font: inherit; font-size: 13px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D7D4CC; background: #FFFFFF; color: #18181B; white-space: nowrap">No category <b style="color: #C2461A">2</b></button>
<button style="font: inherit; font-size: 13px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #D7D4CC; background: #FFFFFF; color: #18181B; white-space: nowrap">Belongings</button>
</div><div style="background: #FFF4D6; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A6400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8.5a5 5 0 0 1 0 7M12 6a8.5 8.5 0 0 1 0 12M15.5 3.5a12 12 0 0 1 0 17"></path></svg>
<span style="flex-grow: 1; font-size: 13px; color: #5C3D00">3 came in from Apple Pay. Check the category and they’re done.</span>
<span style="font-size: 13px; font-weight: 600; color: #5C3D00">Review</span>
</div><sc-for list="{{days}}" as="day" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; padding: 0 4px; font-size: 12px; font-weight: 600; color: #5F5E66"><span>{{day.date}}</span><span>{{day.total}}</span></div>
<div style="background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 14px; padding: 0 14px">
<sc-for list="{{day.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: {{r.line}}">
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{r.tint}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0">{{r.mark}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 12px; color: {{r.subColor}}">{{r.sub}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 14px; font-weight: 600; color: {{r.amountColor}}">{{r.amount}}</span><span style="font-size: 11px; color: #5F5E66">{{r.via}}</span></span>
</div>
</sc-for>
</div>
</section>
</sc-for></div></div><nav aria-label="Tabs" style="position: absolute; left: 0; bottom: 0; width: 760px; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #E4E2DD; display: flex; justify-content: space-around; align-items: flex-start">
<a href="Main.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5F5E66; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Transactions.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #C2461A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>Transactions</a>
<a href="Wallet.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5F5E66; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v3h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 6v13a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Wallet</a>
<a href="Belongings.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5F5E66; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Belongings</a>
<a href="Budget.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5F5E66; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Plan</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":1100}}'>
class Component extends DCLogic {

{ date: 'Tue 30 Sep', total: '−¥2,350', rows: [

{ mark: 'Ni', tint: '#FFF4D6', ink: '#9A6400', name: 'Nishi Pharmacy', sub: 'To review · Household?', subColor: warn, amount: '−¥2,380', amountColor: out, via: 'Apple Pay · SMBC', line: rule }

{ date: 'Sun 28 Sep', total: '−¥2,480', rows: [
{ mark: 'Ne', tint: '#F0ECFB', ink: '#6A4FC7', name: 'Netflix', sub: 'Subscriptions · every month', subColor: quiet, amount: '−¥1,590', amountColor: out, via: 'SMBC Card', line: first },
{ mark: 'Ha', tint: '#FFF4D6', ink: '#9A6400', name: 'Hanamaru Udon', sub: 'To review · Eating out?', subColor: warn, amount: '−¥890', amountColor: out, via: 'Apple Pay · Rakuten', line: rule }
]}
]
};
}
}
</script>
</body>
</html>
