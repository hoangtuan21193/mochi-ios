<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Transactions (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#F08A5D}a:hover{color:#F5A07A}
</style>
</helmet>
<div style="color-scheme: dark; position: relative; width: 390px; height: 1000px; overflow: hidden; background: #111113; color: #F2F1EE; font-family: 'Geist', 'Noto Sans JP', sans-serif; font-variant-numeric: tabular-nums">

<div style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Transactions</h1>
<div style="display: flex; gap: 8px">
<a href="Scan.dc.html" aria-label="Scan a receipt" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #2C2C31; background: #1C1C1F; color: #F2F1EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M8 9h8M8 12h8M8 15h5"></path></svg></a>
<button aria-label="Search" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2C2C31; background: #1C1C1F; color: #F2F1EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button aria-label="Import a statement" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2C2C31; background: #1C1C1F; color: #F2F1EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5"></path></svg></button>
</div>
</div>

<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #26262A; border-radius: 10px; padding: 3px">
<a href="TransactionsDark.dc.html" role="tab" aria-selected="true" style="height: 34px; border-radius: 8px; background: #3A3A40; color: #F2F1EE; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">List</a>
<a href="SpendingDark.dc.html" role="tab" aria-selected="false" style="height: 34px; border-radius: 8px; color: #A3A1AA; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center">Spending</a>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 4px">
<button aria-label="Previous month" style="width: 32px; height: 32px; border: none; background: transparent; color: #F2F1EE; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<span style="font-size: 15px; font-weight: 600; white-space: nowrap">September 2026</span>
<button aria-label="Next month" style="width: 32px; height: 32px; border: none; background: transparent; color: #6E6C75; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</div>
<span style="font-size: 12px; color: #A3A1AA; margin-top: -8px">142 transactions · in ¥452,000 · out ¥366,420</span>

<div style="display: flex; gap: 8px; overflow: hidden">
<button style="font: inherit; font-size: 13px; font-weight: 600; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #F2F1EE; background: #F2F1EE; color: #111113; white-space: nowrap">All</button>
<button style="font: inherit; font-size: 13px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3A40; background: #1C1C1F; color: #F2F1EE; white-space: nowrap">To review <b style="color: #F08A5D">3</b></button>
<button style="font: inherit; font-size: 13px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3A40; background: #1C1C1F; color: #F2F1EE; white-space: nowrap">No category <b style="color: #F08A5D">2</b></button>
<button style="font: inherit; font-size: 13px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3A40; background: #1C1C1F; color: #F2F1EE; white-space: nowrap">Belongings</button>
</div>

<div style="background: #3A2E10; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9B64A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8.5a5 5 0 0 1 0 7M12 6a8.5 8.5 0 0 1 0 12M15.5 3.5a12 12 0 0 1 0 17"></path></svg>
<span style="flex-grow: 1; font-size: 13px; color: #F2CF7E">3 came in from Apple Pay. Check the category and they’re done.</span>
<span style="font-size: 13px; font-weight: 600; color: #F2CF7E">Review</span>
</div>

<sc-for list="{{days}}" as="day" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; padding: 0 4px; font-size: 12px; font-weight: 600; color: #A3A1AA"><span>{{day.date}}</span><span>{{day.total}}</span></div>
<div style="background: #1C1C1F; border: 1px solid #2C2C31; border-radius: 14px; padding: 0 14px">
<sc-for list="{{day.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: {{r.line}}">
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{r.tint}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0">{{r.mark}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 12px; color: {{r.subColor}}">{{r.sub}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 14px; font-weight: 600; color: {{r.amountColor}}">{{r.amount}}</span><span style="font-size: 11px; color: #A3A1AA">{{r.via}}</span></span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>

<nav aria-label="Tabs" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #1C1C1F; border-top: 1px solid #2C2C31; display: flex; justify-content: space-around; align-items: flex-start">
<a href="MainDark.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A3A1AA; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="TransactionsDark.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #F08A5D; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>Transactions</a>
<a href="Wallet.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A3A1AA; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v3h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 6v13a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Wallet</a>
<a href="BelongingsDark.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A3A1AA; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Belongings</a>
<a href="Budget.dc.html" style="width: 68px; height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A3A1AA; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Plan</a>
</nav>

</div>
</x-dc>

</body>
</html>
