<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.14); padding: 8px 12px; border-radius: 999px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Read on this iPhone</span>

<div style="text-align: center; font-size: 14px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; outline: 2px solid #F0874F; outline-offset: 3px; border-radius: 2px">ローソン 新宿三丁目店</div>
<div style="text-align: center; color: #555">東京都新宿区新宿 0-0-0</div>

</div>
</div>

</div>
