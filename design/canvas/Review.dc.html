<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check and save</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#3A3A3E}
a{color:#C2461A}a:hover{color:#9E3712}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; overflow: hidden; background: #3A3A3E; color: #18181B; font-family: 'Geist', 'Noto Sans JP', sans-serif; font-variant-numeric: tabular-nums">

<div style="position: absolute; left: 0; top: 56px; width: 390px; height: 944px; box-sizing: border-box; background: #F4F3F0; border-radius: 22px 22px 0 0; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #CFCCC5"></div>

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; min-height: 44px; display: flex; align-items: center">Cancel</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Check and save</h1>
<a href="Scan.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; min-height: 44px; display: flex; align-items: center">Retake</a>
</div>

<section style="background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center">
<button aria-label="Show the receipt photo" style="position: relative; padding: 0; border: none; background: none; flex-shrink: 0"><div style="width: 64px; height: 86px; border-radius: 6px; background: #FBFAF6; border: 1px solid #E4E2DD; box-sizing: border-box; padding: 6px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<span style="height: 4px; border-radius: 2px; background: #D7D4CC"></span><span style="height: 3px; width: 70%; border-radius: 2px; background: #E4E2DD"></span><span style="height: 3px; border-radius: 2px; background: #E4E2DD"></span><span style="height: 3px; border-radius: 2px; background: #E4E2DD"></span><span style="height: 3px; width: 80%; border-radius: 2px; background: #E4E2DD"></span><span style="height: 5px; margin-top: 6px; border-radius: 2px; background: #F0874F"></span>
</div><span aria-hidden="true" style="position: absolute; right: 3px; bottom: 3px; width: 20px; height: 20px; border-radius: 10px; background: rgba(240,238,234,0.92); display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span></button>
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<label for="amt" style="font-size: 12px; color: #5F5E66">Amount</label>
<div style="display: flex; align-items: center; gap: 6px"><input id="amt" value="¥1,280" style="font: inherit; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; border: none; padding: 0; background: transparent; min-width: 0; flex-grow: 1; color: #18181B; width: 100%"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A98A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></div>
<span style="font-size: 12px; color: #1E7A4A">Read from 合計 · the lines add up to it</span>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 16px; padding: 0 16px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: 1px solid #EFEDE8">
<span style="width: 84px; font-size: 13px; color: #5F5E66; flex-shrink: 0">{{f.label}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{f.value}}</span><span style="font-size: 12px; color: {{f.noteColor}}">{{f.note}}</span></span>
<sc-if value="{{f.edit}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A98A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></sc-if>
</div>
</sc-for>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 16px; padding: 0 16px"><a href="CategoryPicker.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; text-decoration: none; color: #18181B"><span style="width: 72px; font-size: 13px; color: #5F5E66; flex-shrink: 0">Category</span><span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(168,122,14,0.13); color: #A87A0E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.2M7.7 19.5a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0M15.7 19.5a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Groceries</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F5E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 18 6-6-6-6"></path></svg></a><a href="SplitBill.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #EFEDE8; text-decoration: none; color: #18181B"><span style="width: 72px; font-size: 13px; color: #5F5E66; flex-shrink: 0">Split</span><span style="flex-grow: 1; font-size: 15px; font-weight: 500">Shared with someone? Split it</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F5E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 18 6-6-6-6"></path></svg></a></section>


<label style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 16px; padding: 14px 16px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Keep the receipt photo</span><span style="font-size: 12px; color: #5F5E66">Stays on this iPhone · handy for warranty and returns</span></span>
<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #C2461A">
</label>

<p style="margin: 0; font-size: 12px; line-height: 17px; color: #5F5E66">¥1,280 goes on Rakuten Card · on the statement closing 15 Oct · paid 10 Nov</p>

<div style="display: flex; gap: 8px">
<a href="Scan.dc.html" style="flex-grow: 1; height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D7D4CC; box-sizing: border-box; color: #18181B; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Save and scan next</a>
<a href="Main.dc.html" style="flex-grow: 1; height: 52px; border-radius: 14px; background: #C2461A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Save</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const ok = '#1E7A4A', check = '#9A6400', quiet = '#5F5E66';
return {
fields: [
{ edit: true, label: 'Shop', value: 'Sunmart 渋谷道玄坂店', note: 'Known by its registration number', noteColor: ok },
{ edit: true, label: 'When', value: 'Tue 30 Sep · 12:41', note: 'Read from the receipt', noteColor: quiet },
{ label: 'Paid with', value: 'Rakuten Card', note: 'VISA ending 1234 on the receipt', noteColor: ok },
{ label: 'Where', value: 'Shibuya Mark City', note: 'From Apple Maps · kept with this spend', noteColor: quiet },
{ label: 'Address', value: '東京都渋谷区道玄坂 0-0-0', note: 'Printed on the receipt', noteColor: quiet },
{ label: 'Note', value: 'Add a note', note: 'Nothing on the receipt to go on', noteColor: check, edit: true }
],
lines: [
{ name: 'おにぎり 鮭', price: '¥180' },
{ name: 'サラダ', price: '¥398' },
{ name: '緑茶 500ml', price: '¥162' },
{ name: 'からあげ', price: '¥540' }
]
};
}
}
</script>
</body>
</html>
